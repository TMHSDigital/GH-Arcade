version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for all minor and patch bumps; majors arrive on their own.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not run on TypeScript 7 yet (issue #26). Remove this once it does.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node's types stay on the oldest Node major the project supports (see "engines" in package.json).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
