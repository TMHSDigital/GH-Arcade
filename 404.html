<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05050d" />
    <!-- GitHub Pages serves this page, with a 404 status, for any address on the site that does not exist. -->
    <meta name="robots" content="noindex" />
    <title>Page not found · GH Arcade</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/hub/hub.css" />
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <main class="marquee">
      <p class="eyebrow">Game over</p>
      <h1 class="title">404<span>No cabinet</span></h1>
      <p class="tagline">There is nothing at this address. The game may have moved, or the link has a typo.</p>
      <!-- Served at any depth, so the link is absolute (base path from vite.config.ts). -->
      <a class="install" href="/GH-Arcade/">Back to the arcade</a>
    </main>
  </body>
</html>
